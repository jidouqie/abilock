name: Public source hygiene

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Audit tracked source and reachable history
        run: node scripts/check-public-source.mjs
      - name: Install locked test tools without lifecycle scripts
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org
      - name: Exercise public-source guard with synthetic values
        run: npx --no-install tsx --test tests/public-source.test.ts
